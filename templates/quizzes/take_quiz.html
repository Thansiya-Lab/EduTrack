{% extends 'base.html' %}
{% block title %}{{ quiz.title }}{% endblock %}
{% block content %}
<h2>{{ quiz.title }}</h2>
<form method="post">
    {% csrf_token %}
    {% for question in quiz.questions.all %}
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ forloop.counter }}. {{ question.text }}</h5>
                {% for choice in question.choices.all %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" id="choice_{{ choice.id }}" required>
                        <label class="form-check-label" for="choice_{{ choice.id }}">{{ choice.text }}</label>
                    </div>
                {% endfor %}
            </div>
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Submit Quiz</button>
</form>
{% endblock %}
